<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Мастер PDR</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0d131f; --surface:#151d2d; --surface2:#1c2740; --line:#27334e;
  --text:#eaf0fa; --muted:#8a97b2; --accent:#4fd1b5; --on-accent:#05241d;
  --warn:#f5b94a; --bad:#f2686b; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:18px 16px 8px}
h1{font-size:24px;line-height:1.2;margin:0 0 4px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.cap{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card .cap:first-child{margin-top:0}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat span{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:14px;background:var(--accent);
  color:var(--on-accent);font:600 16px/1 inherit;cursor:pointer;padding:0 16px}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(242,104,107,.4)}
.btn.sm{min-height:40px;width:auto;font-size:14px;border-radius:12px}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.link.bad{color:var(--bad)}
.back{display:inline-block;margin:0 0 10px;text-decoration:none}
label,.lbl{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
.card>label:first-child,.card>.lbl:first-child{margin-top:0}
input,select,textarea{width:100%;min-height:46px;background:var(--bg);border:1px solid var(--line);border-radius:12px;
  color:var(--text);font:inherit;padding:10px 14px;outline:none;appearance:none;-webkit-appearance:none}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:#55617c}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 20px,calc(100% - 14px) 20px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 16px;border-radius:21px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:15px;cursor:pointer}
.chip.sm{min-height:38px;padding:0 13px;font-size:14px}
.chip.on{border-color:var(--accent);background:rgba(79,209,181,.14);color:var(--accent);font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.seg button{flex:1;min-height:42px;border:0;border-right:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;padding:0 6px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--surface2);color:var(--text);font-weight:600}
.seg button.on.ok{background:rgba(79,209,181,.16);color:var(--accent)}
.seg button.on.warn{background:rgba(245,185,74,.16);color:var(--warn)}
.seg button.on.bad{background:rgba(242,104,107,.16);color:var(--bad)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.stepper button{width:56px;min-height:46px;border:0;background:none;color:var(--text);font-size:22px;cursor:pointer}
.stepper span{flex:1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.sum{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.total b{display:block;font-size:26px;color:var(--accent);font-variant-numeric:tabular-nums}
.total .t b{font-size:18px;color:var(--text)}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;margin-bottom:10px;color:var(--text);font:inherit;cursor:pointer;text-decoration:none}
.item b{display:block;margin-bottom:2px}
.item .muted{font-size:14px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:10px;white-space:nowrap}
.badge.new{background:rgba(245,185,74,.16);color:var(--warn)}
.badge.done{background:rgba(79,209,181,.16);color:var(--accent)}
.badge.bad{background:rgba(242,104,107,.16);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:26px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.chk{padding:12px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0;padding-bottom:0}
.chk:first-of-type{padding-top:0}
.chk>span{display:block;font-size:15px;margin-bottom:8px}
.dots{display:flex;gap:6px}
.dots i{font-style:normal;font-size:13px;padding:3px 9px;border-radius:10px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.dots .ok{color:var(--accent)} .dots .warn{color:var(--warn)} .dots .bad{color:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right}
svg.car{display:block;width:100%;max-width:340px;margin:0 auto}
svg.car .z{fill:var(--surface2);stroke:var(--line);stroke-width:1.5;cursor:pointer}
svg.car .z.on{fill:rgba(79,209,181,.2);stroke:var(--accent)}
svg.car text{fill:var(--muted);font-size:10px;text-anchor:middle;pointer-events:none}
svg.car .n{fill:var(--accent)} svg.car .nt{fill:var(--on-accent);font-size:11px;font-weight:700}
.lvl{display:inline-flex;gap:3px;vertical-align:middle}
.lvl i{width:14px;height:5px;border-radius:3px;background:var(--line)}
.lvl i.on{background:var(--accent)}
.set{display:grid;grid-template-columns:1fr 96px 84px;gap:8px;align-items:center;margin-bottom:8px;font-size:14px}
.set.two{grid-template-columns:1fr 96px}
.set input{min-height:42px;padding:8px 10px;text-align:right}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,19,31,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;max-width:112px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;color:var(--muted);text-decoration:none;font-size:11px}
nav a.on{color:var(--accent)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:9;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<datalist id="dl-brands"></datalist>
<datalist id="dl-models"></datalist>
<script>
'use strict';
/* ───────── основа ───────── */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const inTg = !!(tg && tg.initData);
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const rub = n => Math.round(n || 0).toLocaleString('ru-RU') + ' ₽';
const dur = m => { m = Math.round(m || 0); if (!m) return '—'; const h = Math.floor(m / 60), r = m % 60; return [h ? h + ' ч' : '', r ? r + ' мин' : ''].filter(Boolean).join(' '); };
const dt = t => new Date(t).toLocaleDateString('ru-RU', {day: 'numeric', month: 'short', year: 'numeric'});
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n >= 0 ? n : 0; };

const DEFAULTS = {
  name: 'Мастер PDR',
  sub: 'Расчёт, осмотр и учёт заказов',
  sizes: [
    {id: 's1', label: 'До 2 см', price: 1500, min: 30},
    {id: 's2', label: '2–4 см', price: 2500, min: 60},
    {id: 's3', label: '4–7 см', price: 4000, min: 90},
    {id: 's4', label: 'Свыше 7 см', price: 7000, min: 180}
  ],
  locs: [
    {id: 'flat', label: 'Плоская панель', k: 1},
    {id: 'rib', label: 'Ребро жёсткости', k: 1.4},
    {id: 'edge', label: 'Кромка панели', k: 1.5},
    {id: 'pillar', label: 'Стойка или рейлинг крыши', k: 1.6},
    {id: 'alu', label: 'Алюминиевая панель', k: 1.5},
    {id: 'hard', label: 'Труднодоступное место', k: 1.3},
    {id: 'stretch', label: 'Растянутый металл', add: 'stretch'},
    {id: 'device', label: 'Работа прибором', add: 'device'}
  ],
  extras: {film: 1500, hailPrice: 500, hailMin: 5, stretchS: 500, stretchL: 1000, device: 1000},
  oldK: 1.15,
  round: 100
};
const ZONES = [
  ['hood', 'Капот'], ['roof', 'Крыша'], ['trunk', 'Крышка багажника'],
  ['lf', 'Переднее левое крыло'], ['lfd', 'Передняя левая дверь'], ['lrd', 'Задняя левая дверь'], ['lr', 'Заднее левое крыло'],
  ['rf', 'Переднее правое крыло'], ['rfd', 'Передняя правая дверь'], ['rrd', 'Задняя правая дверь'], ['rr', 'Заднее правое крыло'],
  ['lp', 'Стойка крыши левая'], ['rp', 'Стойка крыши правая'], ['ls', 'Порог левый'], ['rs', 'Порог правый']
];
const zoneName = id => (ZONES.find(z => z[0] === id) || [0, ''])[1];
const CHECK = [
  ['Кузов', [['b1', 'Вмятины на панелях'], ['b2', 'Сколы и царапины до металла'], ['b3', 'Зазоры дверей, капота, багажника'], ['b4', 'Коррозия и вздутия металла']]],
  ['Лакокрасочное покрытие', [['p1', 'Совпадение оттенка по панелям'], ['p2', 'Шагрень, фактура лака'], ['p3', 'Пузыри и вспучивание'], ['p4', 'Равномерность блеска']]],
  ['Следы ремонта', [['r1', 'Шпаклёвка (проверка магнитом)'], ['r2', 'Следы сварки, подкраска кромок'], ['r3', 'Замена деталей, чужие кромки'], ['r4', 'Напыл краски на резинках и пластике']]]
];
const CHECK_N = CHECK.reduce((a, g) => a + g[1].length, 0);
const MARKS = [['ok', 'Норма'], ['warn', 'Внимание'], ['bad', 'Дефект']];
const LIBRARY = [
  ['Парковочная вмятина', 1, 'Плавная, без острых складок — обычно от соседней двери. Чаще на дверях и крыльях. Убирается быстрее всего.'],
  ['Градовые вмятины', 2, 'Много мелких вмятин на капоте, крыше и багажнике. Каждая простая, но считают по количеству.'],
  ['Крупная плавная вмятина', 3, 'Больше 7 см, металл вытянут. Нужно несколько проходов, время растёт заметно.'],
  ['Вмятина на ребре жёсткости', 3, 'Линия кузова должна остаться ровной. Работа тоньше и дольше, чем на плоскости.'],
  ['Вмятина с заломом', 3, 'Острая складка металла. После правки может остаться едва заметный след — клиента предупреждают заранее.'],
  ['Вмятина на кромке панели', 3, 'У края двери или капота металл сложен вдвое, доступ инструментом ограничен.'],
  ['Вмятина на алюминии', 3, 'Алюминий жёстче и хуже возвращает форму, чем сталь. Закладывают больше времени.'],
  ['Стойка или рейлинг крыши', 4, 'Двойной металл и почти нет доступа изнутри. Самая трудоёмкая зона, работают в основном клеевой системой.'],
  ['Повреждена краска', 0, 'Трещины, сколы или вздутия в месте удара. Без покраски такое не убрать — метод не подходит.']
];
const BRANDS = {
  'Lada': 'Granta,Vesta,Niva Legend,Niva Travel,Largus,XRAY,Kalina,Priora,Aura,Iskra',
  'Toyota': 'Camry,Corolla,RAV4,Land Cruiser 200,Land Cruiser 300,Land Cruiser Prado,Highlander,Fortuner,Hilux,C-HR,Alphard',
  'Kia': 'Rio,Ceed,Cerato,K5,Optima,Sportage,Sorento,Seltos,Soul,Mohave,Carnival,Picanto',
  'Hyundai': 'Solaris,Creta,Elantra,Sonata,Tucson,Santa Fe,Palisade,i30,Staria',
  'Volkswagen': 'Polo,Jetta,Passat,Tiguan,Touareg,Golf,Taos,Teramont,Caravelle,Multivan',
  'Skoda': 'Rapid,Octavia,Superb,Karoq,Kodiaq,Fabia,Yeti',
  'BMW': '1 серии,2 серии,3 серии,4 серии,5 серии,7 серии,X1,X2,X3,X4,X5,X6,X7',
  'Mercedes-Benz': 'A-Класс,C-Класс,E-Класс,S-Класс,CLA,CLS,GLA,GLB,GLC,GLE,GLS,G-Класс,V-Класс',
  'Audi': 'A3,A4,A5,A6,A7,A8,Q3,Q5,Q7,Q8',
  'Nissan': 'Almera,Qashqai,X-Trail,Murano,Terrano,Juke,Pathfinder,Patrol,Teana',
  'Renault': 'Logan,Sandero,Duster,Kaptur,Arkana,Megane,Fluence,Koleos',
  'Mazda': '3,6,CX-5,CX-7,CX-9,CX-30',
  'Mitsubishi': 'Lancer,Outlander,ASX,Pajero,Pajero Sport,L200,Eclipse Cross',
  'Honda': 'Civic,Accord,CR-V,Pilot,HR-V,Fit',
  'Ford': 'Focus,Fiesta,Mondeo,Kuga,Explorer,EcoSport,Transit',
  'Chevrolet': 'Cruze,Aveo,Lacetti,Niva,Captiva,Tahoe,Cobalt,Spark',
  'Lexus': 'ES,IS,LS,NX,RX,GX,LX,UX',
  'Subaru': 'Forester,Outback,XV,Impreza,Legacy',
  'Volvo': 'S60,S90,XC40,XC60,XC90',
  'Land Rover': 'Range Rover,Range Rover Sport,Range Rover Evoque,Range Rover Velar,Discovery,Discovery Sport,Defender',
  'Porsche': 'Cayenne,Macan,Panamera,911,Taycan',
  'Haval': 'Jolion,F7,F7x,H6,H9,Dargo,M6',
  'Chery': 'Tiggo 4,Tiggo 7 Pro,Tiggo 7 Pro Max,Tiggo 8,Tiggo 8 Pro,Arrizo 8',
  'Geely': 'Coolray,Atlas,Atlas Pro,Monjaro,Tugella,Emgrand,Okavango',
  'Changan': 'CS35 Plus,CS55 Plus,CS75 Plus,UNI-K,UNI-T,UNI-V,Alsvin',
  'Exeed': 'LX,TXL,VX,RX',
  'Omoda': 'C5,S5',
  'Jaecoo': 'J7,J8',
  'Tank': '300,500,700',
  'Li Auto': 'L6,L7,L8,L9',
  'Zeekr': '001,009,X,7X',
  'Moskvich': '3,6',
  'UAZ': 'Patriot,Hunter,Pickup',
  'GAZ': 'Газель Next,Соболь,Volga',
  'Opel': 'Astra,Corsa,Insignia,Mokka,Zafira',
  'Peugeot': '208,308,408,2008,3008,5008',
  'Citroen': 'C3,C4,C5 Aircross,Berlingo',
  'Suzuki': 'Vitara,SX4,Jimny,Swift',
  'Infiniti': 'Q50,QX50,QX60,QX80,FX',
  'Tesla': 'Model 3,Model S,Model X,Model Y'
};

/* ───────── данные и хранение ───────── */
const LS = 'pdr:';
const cloud = inTg && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') && tg.CloudStorage ? tg.CloudStorage : null;
let S = JSON.parse(JSON.stringify(DEFAULTS));
const DB = {orders: [], insps: [], cars: []};

function lsAll() {
  const out = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(LS) === 0) out[k.slice(LS.length)] = localStorage.getItem(k); } } catch (e) {}
  return out;
}
function lsReplace(map) {
  try {
    Object.keys(lsAll()).forEach(k => localStorage.removeItem(LS + k));
    Object.keys(map).forEach(k => localStorage.setItem(LS + k, map[k]));
  } catch (e) {}
}
function put(key, obj) {
  const v = JSON.stringify(obj);
  if (v.length > 4000) { toast('Запись слишком длинная — сократите комментарий'); return false; }
  try { localStorage.setItem(LS + key, v); } catch (e) {}
  if (cloud) cloud.setItem(key, v, err => { if (err) toast('Не удалось сохранить в облако Telegram'); });
  return true;
}
function del(key) {
  try { localStorage.removeItem(LS + key); } catch (e) {}
  if (cloud) cloud.removeItem(key, () => {});
}
function applySettings(raw) {
  const d = JSON.parse(JSON.stringify(DEFAULTS));
  if (raw && typeof raw === 'object') {
    if (typeof raw.name === 'string' && raw.name.trim()) d.name = raw.name.trim().slice(0, 40);
    if (typeof raw.sub === 'string') d.sub = raw.sub.slice(0, 80);
    d.sizes.forEach(s => { const r = (raw.sizes || []).find(x => x && x.id === s.id); if (r) { s.price = num(r.price); s.min = num(r.min); } });
    d.locs.forEach(l => { const r = (raw.locs || []).find(x => x && x.id === l.id); if (l.k != null && r && num(r.k) > 0) l.k = num(r.k); });
    Object.keys(d.extras).forEach(k => { if (raw.extras && raw.extras[k] != null) d.extras[k] = num(raw.extras[k]); });
    if (num(raw.oldK) > 0) d.oldK = num(raw.oldK);
    if (num(raw.round) > 0) d.round = num(raw.round);
  }
  S = d;
  document.title = S.name;
}
function ingest(map) {
  DB.orders = []; DB.insps = []; DB.cars = [];
  applySettings(null);
  Object.keys(map).forEach(k => {
    let o; try { o = JSON.parse(map[k]); } catch (e) { return; }
    if (!o || typeof o !== 'object') return;
    if (k === 'settings') applySettings(o);
    else if (k.indexOf('o_') === 0 && o.id) DB.orders.push(o);
    else if (k.indexOf('i_') === 0 && o.id) DB.insps.push(o);
    else if (k.indexOf('c_') === 0 && o.id) DB.cars.push(o);
  });
  const byT = (a, b) => (b.t || 0) - (a.t || 0);
  DB.orders.sort(byT); DB.insps.sort(byT); DB.cars.sort(byT);
}
function loadCloud(done) {
  cloud.getKeys((err, keys) => {
    if (err || !Array.isArray(keys)) { done(); return; }
    if (!keys.length) { // первый запуск в Telegram: поднимаем в облако то, что уже есть на устройстве
      const local = lsAll();
      Object.keys(local).forEach(k => cloud.setItem(k, local[k], () => {}));
      done(); return;
    }
    const map = {}; let i = 0;
    (function next() {
      const part = keys.slice(i, i + 100); i += 100;
      if (!part.length) { ingest(map); lsReplace(map); done(); return; }
      cloud.getItems(part, (e, vals) => { if (!e && vals) Object.assign(map, vals); next(); });
    })();
  });
}

/* ───────── черновики ───────── */
const carFields = c => ({carId: c && c.id || '', brand: c && c.brand || '', model: c && c.model || '', year: c && c.year || '', plate: c && c.plate || '', client: c && c.client || '', phone: c && c.phone || ''});
const newDent = z => ({s: S.sizes[0].id, ls: ['flat'], q: 1, z: z || ''});
const newDraft = c => ({car: carFields(c), paint: 'fresh', dents: [newDent()], hail: {on: false, parts: {}, up: 0, down: 0}, film: true, arm: '', comment: ''});
const newIDraft = c => ({car: carFields(c), marks: {}, comment: ''});

function calcDent(d, paint) {
  const si = Math.max(0, S.sizes.findIndex(x => x.id === d.s)), s = S.sizes[si];
  const ls = (d.ls && d.ls.length ? d.ls : ['flat']).map(id => S.locs.find(x => x.id === id)).filter(Boolean);
  let k = 1, add = 0;
  ls.forEach(l => { if (l.add === 'stretch') add += si < 2 ? S.extras.stretchS : S.extras.stretchL; else if (l.add === 'device') add += S.extras.device; else k += l.k - 1; });
  const r = S.round || 100, q = d.q || 1;
  return {p: Math.round((s.price * k * (paint === 'old' ? S.oldK : 1) + add) * q / r) * r, m: Math.round(s.min * k * q / 5) * 5, size: s.label, loc: ls.map(l => l.label).join(', ')};
}
function calcHail() {
  const h = draft.hail, r = S.round || 100;
  const n = h.on ? Object.keys(h.parts).reduce((a, z) => a + (h.parts[z] || 0), 0) : 0;
  return {n, p: Math.round(S.extras.hailPrice * n * (1 + h.up / 100) * (1 - h.down / 100) / r) * r, m: Math.round(S.extras.hailMin * n / 5) * 5};
}
function calcTotal() {
  const t = draft.dents.reduce((a, d) => { const c = calcDent(d, draft.paint); a.p += c.p; a.m += c.m; return a; }, {p: 0, m: 0});
  const hail = calcHail(), film = draft.film ? S.extras.film : 0, arm = Math.round(num(draft.arm));
  return {p: t.p + hail.p + film + arm, m: t.m + hail.m, hail, film, arm};
}
const dentsWord = n => { const a = n % 100, b = n % 10; return n + ' ' + (a > 10 && a < 20 ? 'вмятин' : b === 1 ? 'вмятина' : b > 1 && b < 5 ? 'вмятины' : 'вмятин'); };

function extraRows(o) { // [название, сумма] для заказа и сметы

  if (o.film) rows.push(['Защитная плёнка', o.film]);
  if (o.arm) rows.push(['Арматурные работы', o.arm]);
  return rows;
}

function upsertCar(c) {
  const plate = normPlate(c.plate);
  let car = (c.carId && DB.cars.find(x => x.id === c.carId)) ||
    (plate && DB.cars.find(x => normPlate(x.plate) === plate)) ||
    (!plate && c.brand && DB.cars.find(x => !x.plate && x.brand === c.brand && x.model === c.model && (x.client || '') === (c.client || '')));
  if (car) {
    ['brand', 'model', 'year', 'plate', 'client', 'phone'].forEach(f => { if (c[f]) car[f] = c[f]; });
  } else {
    car = {id: uid(), t: Date.now(), brand: c.brand, model: c.model, year: c.year, plate: c.plate, client: c.client, phone: c.phone, note: ''};
    DB.cars.unshift(car);
  }
  put('c_' + car.id, car);
  return car.id;
}

let toastT;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200); }
function buzz(kind) { try { if (inTg && tg.HapticFeedback) kind ? tg.HapticFeedback.notificationOccurred(kind) : tg.HapticFeedback.selectionChanged(); } catch (e) {} }
function ask(msg, cb) {
  if (inTg && tg.showConfirm && tg.isVersionAtLeast('6.2')) tg.showConfirm(msg, ok => { if (ok) cb(); });
  else if (window.confirm(msg)) cb();
}
function copy(text, okMsg) {
  const done = () => toast(okMsg || 'Скопировано');
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Не удалось скопировать'); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

  const el = e.target, s = el.dataset.s; if (!s) return;
  if (s === 'carq') { carQ = el.value; $('#carlist').innerHTML = carList(); return; }
  if (s === 'hail') { const n = Math.min(999, Math.floor(num(el.value))); if (n) draft.hail.parts[el.dataset.f] = n; else delete draft.hail.parts[el.dataset.f]; draft.hail.on = true; return; }
  const target = {calc: draft.car, insp: idraft.car, car: cdraft, calcroot: draft, insproot: idraft}[s];
  if (!target) return;
  target[el.dataset.f] = el.dataset.f === 'plate' ? el.value.toUpperCase() : el.value;
  if (el.dataset.f === 'arm') { const tp = $('#tot-p'); if (tp) tp.textContent = rub(calcTotal().p); }
  if (el.dataset.f === 'brand') { fillModels(el.value); if (s !== 'car') target.carId = ''; }
});

/* ───────── запуск ───────── */
$('#dl-brands').innerHTML = Object.keys(BRANDS).map(b => `<option value="${esc(b)}">`).join('');
const ALLOWED = ['3dbc5668d9ad59e693e9efa80c629d33013e71ce0d510c352301543995f4c073', '68bc4b3cc5a2ddce4dbbfedcb885b68310562cb473685c46cc80ce00fa20ce20']; // отпечатки Telegram ID тех, кому открыт доступ
const isLocal = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const me = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
if (tg) { try { tg.ready(); tg.expand(); if (inTg) { tg.setHeaderColor('#0d131f'); tg.setBackgroundColor('#0d131f'); tg.BackButton.onClick(() => history.back()); } } catch (e) {} }
async function allowed() {
  if (isLocal) return true;
  if (!me || !window.crypto || !crypto.subtle) return false;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('pdr:' + me));
  const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  return ALLOWED.indexOf(hex) >= 0;
}
locked = true;
allowed().catch(() => false).then(ok => {
  if (!ok) {
    $('#nav').style.display = 'none';
    $('#app').innerHTML = `<div class="card" style="margin-top:22vh;text-align:center"><h1>Доступ закрыт</h1><p class="muted" style="margin:8px 0 0">${me ? 'Это личное приложение мастера. Ваш Telegram ID: ' + me : 'Приложение открывается только через бота в Telegram.'}</p></div>`;
    return;
  }
  locked = false;
  ingest(lsAll());
  draft = newDraft(); idraft = newIDraft();
  render();
  if (cloud) loadCloud(() => { const a = document.activeElement; if (!a || !/INPUT|TEXTAREA|SELECT/.test(a.tagName)) render(); });
});
